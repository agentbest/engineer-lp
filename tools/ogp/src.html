<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<!-- OGP画像（1200×630）の原本。再出力手順は同じフォルダの README.md -->
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden}
  body{position:relative;box-sizing:border-box;background:#0A1524;color:#E7EEF9;
    font-family:"Yu Gothic","YuGothic","Meiryo",sans-serif;
    background-image:radial-gradient(ellipse 70% 90% at 100% 0%,#101E33 0%,#0A1524 70%);
    border-left:14px solid #7DB2FF}
  .in{position:absolute;left:84px;right:84px;top:0;bottom:130px;display:flex;flex-direction:column;justify-content:center}
  .eye{margin:0 0 30px;font-size:24px;font-weight:700;letter-spacing:.08em;color:#7DB2FF;display:flex;align-items:center;gap:16px}
  .eye::before{content:"";width:40px;height:3px;background:#7DB2FF;display:block}
  h1{margin:0;font-family:"Yu Gothic","YuGothic","Meiryo",sans-serif;font-weight:700;font-size:70px;line-height:1.3;letter-spacing:.02em}
  h1 .hl{color:#7DB2FF}
  .sub{margin:30px 0 0;font-size:25px;color:#93A3BC;letter-spacing:.04em}
  .foot{position:absolute;left:84px;right:84px;bottom:46px;display:flex;align-items:center;justify-content:space-between;
    border-top:1px solid rgba(255,255,255,.12);padding-top:26px}
  .foot img{height:46px;display:block}
  .foot span{font-family:Consolas,monospace;font-size:21px;color:#93A3BC;letter-spacing:.03em}
</style></head>
<body>
  <div class="in">
    <p class="eye">未経験からのエンジニア転職</p>
    <h1>「未経験OK」だけで<br>選ぶと、<span class="hl">3年後に困る。</span></h1>
    <p class="sub">入口の選び方から、現実的なルートをお伝えします</p>
  </div>
  <div class="foot"><img src="../../logo-white.png" alt="エージェントベスト"><span>engineer.agent-best.net</span></div>
</body></html>
